name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build plugins
        run: ./gradlew make makePluginsJson
      
      - name: Copy files
        run: |
          mkdir -p output
          find . -name "*.cs3" -exec cp {} output/ \;
          if [ -f plugins.json ]; then
            cp plugins.json output/
          fi
      
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: output/
      
      - name: Deploy to builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin builds:builds || git checkout --orphan builds
          git checkout builds
          rm -rf *
          cp -r ../output/* . 2>/dev/null || true
          git add .
          git commit -m "Update plugins [skip ci]" --allow-empty
          git push origin builds
